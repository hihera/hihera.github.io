    <circle cx="124" cy="126" r="4"/><circle cx="206" cy="58" r="4"/>
  </g>
  <circle cx="146" cy="108" r="8" fill="#1B58A1"/>
  <circle cx="206" cy="176" r="8" fill="#1B58A1"/>
  <circle cx="246" cy="106" r="16" fill="#E07B39" opacity=".2"/>
