<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF1FB"/><stop offset="1" stop-color="#F7F9FD"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B58A1" stop-opacity="0"/><stop offset="1" stop-color="#1B58A1" stop-opacity=".28"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173F7A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="360" height="270" fill="url(#bg)"/>
