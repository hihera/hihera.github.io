<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B2FE0"/>
      <stop offset="100%" stop-color="#8B69FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Spirit character (happy state), scaled to fit square icon -->
  <!-- Original coords are 100×110, scaled 0.83, translated(8.5, 3) -->
  <g transform="translate(8.5, 3) scale(0.83)">

    <!-- Smoke puff (yellow, happy) -->
    <circle cx="72" cy="18" r="5" fill="#FFD54F" opacity="0.85"/>

    <!-- Heart decoration -->
    <text x="68" y="14" font-size="9" font-family="serif">❤️</text>

    <!-- Roof (white to contrast purple background) -->
    <polygon points="50,18 18,45 82,45" fill="#FFFDFB"/>
    <polygon points="50,22 26,43 50,43" fill="#C4B5FD" opacity="0.35"/>

    <!-- Chimney -->
    <rect x="66" y="22" width="8" height="16" rx="1.5" fill="#8D6E63"/>
    <rect x="64" y="20" width="12" height="5" rx="1.5" fill="#A1887F"/>

    <!-- Body -->
    <rect x="22" y="44" width="56" height="46" rx="4" fill="#FFFDFB"/>

    <!-- Windows -->
    <rect x="30" y="48" width="16" height="14" rx="2" fill="#F9A825" opacity="0.45"/>
    <rect x="54" y="48" width="16" height="14" rx="2" fill="#F9A825" opacity="0.45"/>
    <line x1="38" y1="48" x2="38" y2="62" stroke="#E0DCD8" stroke-width="0.8"/>
    <line x1="30" y1="55" x2="46" y2="55" stroke="#E0DCD8" stroke-width="0.8"/>
    <line x1="62" y1="48" x2="62" y2="62" stroke="#E0DCD8" stroke-width="0.8"/>
    <line x1="54" y1="55" x2="70" y2="55" stroke="#E0DCD8" stroke-width="0.8"/>

    <!-- Happy eyes (arc = squinting smile) -->
    <path d="M 35,55 Q 38,50 41,55" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 59,55 Q 62,50 65,55" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Blush cheeks -->
    <circle cx="30" cy="64" r="4" fill="#FFAB91" opacity="0.55"/>
    <circle cx="70" cy="64" r="4" fill="#FFAB91" opacity="0.55"/>

    <!-- Door -->
    <rect x="43" y="68" width="14" height="20" rx="7" fill="#8D6E63"/>
    <rect x="44" y="69" width="12" height="18" rx="6" fill="#A1887F"/>
    <circle cx="53" cy="79" r="1.5" fill="#FFD54F"/>

    <!-- Happy mouth (big smile) -->
    <path d="M 44,72 Q 50,80 56,72" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms -->
    <line x1="22" y1="68" x2="12" y2="72" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="72" x2="10" y2="68" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>
    <line x1="78" y1="68" x2="88" y2="72" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="88" y1="72" x2="90" y2="68" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>

    <!-- Feet -->
    <ellipse cx="40" cy="92" rx="5" ry="3" fill="#FFFDFB" stroke="#E0DCD8" stroke-width="0.7"/>
    <ellipse cx="60" cy="92" rx="5" ry="3" fill="#FFFDFB" stroke="#E0DCD8" stroke-width="0.7"/>
  </g>
</svg>
