        .custom-scrollbar::-webkit-scrollbar { height: 12px; }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a3e635; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scrollLeft { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        @keyframes glitch { 
            0% { transform: translate(0) } 
            20% { transform: translate(-2px, 2px) } 
            40% { transform: translate(-2px, -2px) } 
            60% { transform: translate(2px, 2px) } 
            80% { transform: translate(2px, -2px) } 
            100% { transform: translate(0) } 
        }

        .animate-fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

            padding: 0 2px;

        .highlight-text:hover { background-size: 100% 100%; }

        }
        .prose pre code {

        // --- Data Fetching Logic ---
        const useDataFetcher = () => {
            const [content, setContent] = useState(DEFAULT_CONTENT);
            const [status, setStatus] = useState(null);
            const [archives, setArchives] = useState([]);
            
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        // 1. Fetch Status
                        const statusRes = await fetch('data/status.json');
                        if (statusRes.ok) {
                            const statusData = await statusRes.json();
                            setStatus(statusData);
                        }

                        // 2. Fetch Archives
                        const archivesRes = await fetch('data/archives.json');
                        if (archivesRes.ok) {
                            const archivesData = await archivesRes.json();
                            setArchives(archivesData);
                        }

                        // 2.1 Fetch Resume
                        let resumeData = [];
                        try {
                            const resumeRes = await fetch('data/resume.json');
                            if (resumeRes.ok) {
                                const data = await resumeRes.json();
                                resumeData = data.jobs || [];
                            }
                        } catch (e) { console.error("Failed to fetch resume:", e); }

                        // 2.2 Fetch Projects (Chinese)
                        let projectsDataZh = [];
                        try {
                            const projectsRes = await fetch('data/projects.json');
                            if (projectsRes.ok) {
                                const data = await projectsRes.json();
                                projectsDataZh = data.list || [];
                            }
                        } catch (e) { console.error("Failed to fetch zh projects:", e); }

                        // 2.2.1 Fetch Projects (English)
                        let projectsDataEn = [];
                        try {
                            const projectsRes = await fetch('data/en/projects.json');
                            if (projectsRes.ok) {
                                const data = await projectsRes.json();
                                projectsDataEn = data.list || [];
                            }
                        } catch (e) { console.error("Failed to fetch en projects:", e); }

                        // 2.3 Fetch Races (Chinese)
                        let racesDataZh = [];
                        try {
                            const racesRes = await fetch('data/races.json');
                            if (racesRes.ok) {
                                const data = await racesRes.json();
                                racesDataZh = data.races || [];
                            }
                        } catch (e) { console.error("Failed to fetch zh races:", e); }

                        // 2.3.1 Fetch Races (English)
                        let racesDataEn = [];
                        try {
                            const racesRes = await fetch('data/en/races.json');
                            if (racesRes.ok) {
                                const data = await racesRes.json();
                                racesDataEn = data.races || [];
                            }
                        } catch (e) { console.error("Failed to fetch en races:", e); }

                        // 3. Fetch Index (List of all MD files)
                        let indexData = { posts: [], inputs: { books: [], movies: [], podcasts: [], videos: [] } };
                        try {
                            const indexRes = await fetch('data/index.json');
                            if (indexRes.ok) {
                                indexData = await indexRes.json();
                            } else {
                                console.warn("Index file not found, falling back to empty lists.");
                            }
                        } catch (e) {
                            console.error("Failed to fetch index:", e);
                        }

                        // 4. Fetch Blog Posts (Markdown)
                        const postFiles = indexData.posts; 
                        const posts = await Promise.all(postFiles.map(async (file) => {
                            try {
                                const res = await fetch(`data/posts/${file}`);
                                if (!res.ok) return null;
                                const text = await res.text();
                                // 使用 js-yaml 解析 Front Matter
                                const parts = text.split('---');
                                if (parts.length < 3) return null;
                                const frontMatter = jsyaml.load(parts[1]);
                                const body = parts.slice(2).join('---');
                                return { ...frontMatter, content: body };
                            } catch (e) {
                                console.error(`Error loading post ${file}:`, e);
                                return null;
                            }
                        }));
                        
                        // 5. Fetch Inputs (Books, Movies, etc. - old structure)
                        const inputCategories = ['books', 'movies', 'podcasts', 'videos'];
                        const inputsData = {};

                        await Promise.all(inputCategories.map(async (category) => {
                            const files = indexData.inputs[category] || [];
                            const items = await Promise.all(files.map(async (file) => {
                                try {
                                    const res = await fetch(`data/inputs/${category}/${file}`);
                                    if (!res.ok) return null;
                                    const text = await res.text();
                                    const parts = text.split('---');
                                    if (parts.length < 3) return null;
                                    const frontMatter = jsyaml.load(parts[1]);
                                    const body = parts.slice(2).join('---');
                                    return { ...frontMatter, content: body };
                                } catch (e) {
                                    console.error(`Error loading ${category} ${file}:`, e);
                                    return null;
                                }
                            }));
                            inputsData[category] = items.filter(i => i !== null);
                        }));

                        // 6. Fetch Second Brain Data (Creators, Books, Tools) for both languages
                        let zhCreators = {}, zhBooks = [], zhTools = [];
                        let enCreators = {}, enBooks = [], enTools = [];

                        try {
                            const [zhCreatorsRes, zhBooksRes, zhToolsRes, enCreatorsRes, enBooksRes, enToolsRes] = await Promise.all([
                                fetch('data/inputs/zh/creators.json'),
                                fetch('data/inputs/zh/books.json'),
                                fetch('data/inputs/zh/tools.json'),
                                fetch('data/inputs/en/creators.json'),
                                fetch('data/inputs/en/books.json'),
                                fetch('data/inputs/en/tools.json')
                            ]);

                            if (zhCreatorsRes.ok) zhCreators = await zhCreatorsRes.json();
                            if (zhBooksRes.ok) zhBooks = await zhBooksRes.json();
                            if (zhToolsRes.ok) zhTools = await zhToolsRes.json();
                            if (enCreatorsRes.ok) enCreators = await enCreatorsRes.json();
                            if (enBooksRes.ok) enBooks = await enBooksRes.json();
                            if (enToolsRes.ok) enTools = await enToolsRes.json();
                        } catch (e) {
                            console.error("Failed to fetch Second Brain config:", e);
                        }
                        
                        // Update Content State
                        const loadedPosts = posts.filter(p => p !== null);
                        setContent(prev => ({
                            ...prev,
                            zh: {
                                ...prev.zh,
                                resume: { ...prev.zh.resume, jobs: resumeData.length > 0 ? resumeData : prev.zh.resume.jobs },
                                projects: { ...prev.zh.projects, list: projectsDataZh.length > 0 ? projectsDataZh : prev.zh.projects.list },
                                run: { ...prev.zh.run, races: racesDataZh.length > 0 ? racesDataZh : prev.zh.run.races },
                                blog: { ...prev.zh.blog, posts: loadedPosts.length > 0 ? loadedPosts : prev.zh.blog.posts },
                                inputs: {
                                    ...prev.zh.inputs,
                                    // Second Brain data from config files
                                    ai_tech: zhCreators.ai_tech || prev.zh.inputs.ai_tech,
                                    business: zhCreators.business || prev.zh.inputs.business,
                                    english: zhCreators.english || prev.zh.inputs.english,
                                    culture: zhCreators.culture || prev.zh.inputs.culture,
                                    books_recommend: zhBooks.length > 0 ? zhBooks : prev.zh.inputs.books_recommend,
                                    websites_tools: zhTools.length > 0 ? zhTools : prev.zh.inputs.websites_tools,
                                    // Old structure
                                    books: inputsData.books.length > 0 ? inputsData.books : (prev.zh.inputs.books || []),
                                    movies: inputsData.movies.length > 0 ? inputsData.movies : (prev.zh.inputs.movies || []),
                                    podcasts: inputsData.podcasts.length > 0 ? inputsData.podcasts : (prev.zh.inputs.podcasts || []),
                                    videos: inputsData.videos.length > 0 ? inputsData.videos : (prev.zh.inputs.videos || []),
                                }
                            },
                            en: {
                                ...prev.en,
                                // English projects and races from separate JSON files
                                projects: { ...prev.en.projects, list: projectsDataEn.length > 0 ? projectsDataEn : prev.en.projects.list },
                                run: { ...prev.en.run, races: racesDataEn.length > 0 ? racesDataEn : prev.en.run.races },
                                blog: { ...prev.en.blog, posts: loadedPosts.length > 0 ? loadedPosts : prev.en.blog.posts },
                                inputs: {
                                    ...prev.en.inputs,
                                    // Second Brain data from config files (English)
                                    ai_tech: enCreators.ai_tech || prev.en.inputs.ai_tech,
                                    business: enCreators.business || prev.en.inputs.business,
                                    english: enCreators.english || prev.en.inputs.english,
                                    culture: enCreators.culture || prev.en.inputs.culture,
                                    books_recommend: enBooks.length > 0 ? enBooks : prev.en.inputs.books_recommend,
                                    websites_tools: enTools.length > 0 ? enTools : prev.en.inputs.websites_tools,
                                }
                            }
                        }));

                    } catch (error) {
                        console.error("Failed to fetch data:", error);
                    }
                };
                
                fetchData();
            }, []);
            
            return { content, status, archives };
        };

        const ProductCard = ({ product }) => {
            const [mediaIdx, setMediaIdx] = useState(0);
            const [lightboxIdx, setLightboxIdx] = useState(null);

                            <Icon name="externalLink" size={14} /> VISIT →

            if (product.layout === 'video') {
                return (
